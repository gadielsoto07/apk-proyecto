name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependencias del sistema y Buildozer
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libssl-dev libffi-dev python3-dev \
            git zip unzip openjdk-17-jdk ccache libltdl-dev libxml2-dev libxslt1-dev
          pip install --upgrade pip setuptools wheel
          pip install "Cython<3.0.0" buildozer

      - name: Compilar APK con Buildozer
        run: |
          yes | buildozer android debug

      - name: Subir APK generado a Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MiApp-Android-APK
          path: bin/*.apk
