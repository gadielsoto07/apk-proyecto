name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependencias del sistema y Buildozer
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libssl-dev libffi-dev python3-dev \
            git zip unzip openjdk-17-jdk ccache libltdl-dev libxml2-dev libxslt1-dev
          pip install --quiet --upgrade pip setuptools wheel
          pip install --quiet "Cython<3.0.0" buildozer

      - name: Compilar APK con Buildozer
  shell: bash
  run: |
    set -o pipefail
    yes | buildozer android debug 2>&1 | tee buildozer.log

- name: Mostrar últimas líneas del log
  if: failure()
  run: |
    echo "Últimas 200 líneas de Buildozer:"
    tail -n 200 buildozer.log

- name: Subir log completo de Buildozer
  if: always()
  uses: actions/upload-artifact@v4
  with:
    name: buildozer-log
    path: buildozer.log
    if-no-files-found: warn

- name: Subir APK generado a Artifacts
  if: success()
  uses: actions/upload-artifact@v4
  with:
    name: MiApp-Android-APK
    path: bin/*.apk
    if-no-files-found: error

      - name: Subir APK generado a Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MiApp-Android-APK
          path: bin/*.apk
